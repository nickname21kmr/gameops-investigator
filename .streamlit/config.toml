[theme]
base = "light"
primaryColor = "#2A78D6"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#EFEDE7"
textColor = "#16181D"
borderColor = "#E3E1DA"
font = "'IBM Plex Sans', 'Noto Sans SC', sans-serif"
codeFont = "'IBM Plex Mono', monospace"

[server]
headless = true
runOnSave = false
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
