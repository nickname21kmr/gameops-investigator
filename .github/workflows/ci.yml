name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Build deterministic demo database
        run: python scripts/bootstrap_demo.py
      - name: Run automated tests
        run: python -m pytest -q
      - name: Run deterministic offline evaluation
        run: python evals/run_evals.py
      - name: Audit recorded investigation trajectories
        run: |
          python -m gameops_investigator.cli audit-trace reports/tutorial_failure.trace.json
          python -m gameops_investigator.cli audit-trace reports/segment_churn.trace.json
          python -m gameops_investigator.cli audit-trace reports/duplicate_tracking.trace.json
