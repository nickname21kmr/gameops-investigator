[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gameops-investigator"
version = "0.1.0"
description = "Evidence-first game operations incident investigation agent with read-only MCP tools."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.59,<2",
  "pandas>=2.3,<3",
  "plotly>=6.3,<7",
  "mcp[cli]>=1.13,<3",
  "pillow>=11.3,<13",
]

[project.scripts]
gameops = "gameops_investigator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["gameops_investigator*"]

